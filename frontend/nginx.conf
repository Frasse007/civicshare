server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints files in /assets, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths fall back to index.html so deep links
    # and page refreshes work. index.html itself must not be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}