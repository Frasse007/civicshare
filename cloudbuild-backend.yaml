# Cloud Build pipeline: build -> push -> deploy the CivicShare API to Cloud Run.
substitutions:
  _SERVICE_NAME: civicshare-backend
  _REGION: us-central1
  # URL of the deployed frontend, used for CORS.
  _FRONTEND_URL: 'https://REPLACE-WITH-FRONTEND-URL'

steps:
  # 1. Build the backend image, tagged with this build's unique ID (traceable and rollback-friendly) and with "latest".
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - './backend'

  # 2. Push both tags to Container Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME']

  # 3. Deploy to Cloud Run.
  #    - Plain settings are passed as environment variables.
  #    - Sensitive values (database URL, JWT secret) come from Secret Manager,
  #      never from the repo or the image.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:$BUILD_ID'
      - '--platform=managed'
      - '--region=$_REGION'
      - '--allow-unauthenticated'
      - '--port=4000'
      - '--memory=512Mi'
      - '--max-instances=3'
      - '--update-env-vars=NODE_ENV=production,DB_SYNC=true,DATABASE_SSL=true,COOKIE_SAMESITE=none,CORS_ORIGINS=$_FRONTEND_URL'
      - '--update-secrets=DATABASE_URL=civicshare-database-url:latest,JWT_SECRET=civicshare-jwt-secret:latest'

options:
  logging: CLOUD_LOGGING_ONLY
